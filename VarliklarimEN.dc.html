    var wmons = MON.map(function (m, mi) { return { l: m, op: Date.UTC(cyr, mi, 1) <= T0 ? 1 : 0.3, pick: wpick(mi) }; });
    for (wi = YMIN; wi <= 2026; wi++) wyears.push({ l: wi, op: 1, pick: wpick(wi - YMIN) });
    var calOn = !!s.cal && !!kp;
    this._wtgt = calOn && cw ? { m: cmi, y: cyr - YMIN } : null;
    this._wcommit = function () {
      if (typeof document === 'undefined') return;
      var q = function (c) { var n = document.querySelector('.whl-' + c); return n ? Math.round(n.scrollTop / 44) : -1; };
      var qm = q('m'), qy = q('y'); if (qm < 0 || qy < 0) return;
      var c2 = Math.max(0, Math.min(CM, (2026 - (YMIN + qy)) * 12 + (10 - qm)));
      if (c2 === calm) { self.pkWsync(true); return; }
      self.setState({ calm: c2 });
    };
    var cal = { on: calOn, title: MON[cmi] + ' ' + cyr, cells: cells, days: T.wd, wheel: cw, dayView: !cw,
      wm: wmons, wy: wyears, wl: T.wl, wscroll: function (e) { self.pkWheel(e); }, chev: cw ? 180 : 0,
      toggleWheel: function () { self.setState({ cw: !cw }); }, ok: function () { self.setState(cw ? { cw: false } : { cal: false }); },
      prev: function () { if (calm < CM) self.setState({ calm: calm + 1 }); }, next: function () { if (calm > 0) self.setState({ calm: calm - 1 }); },
      prevOp: calm < CM ? 1 : 0.3, nextOp: calm > 0 ? 1 : 0.3, close: function () { self.setState({ cal: false, cw: false }); },
      phase: !isAdd && cph === 1 ? T.phVal : T.phBuy, canPhase: !isAdd, togglePhase: function () { if (!isAdd) self.setState({ cph: cph === 1 ? 0 : 1 }); },
      hint: isAdd ? T.calHintAdd : cph === 1 ? T.calHintVal : T.calHintBuy,
      range: dShort(K.ago, true) + ' → ' + (isAdd ? T.today : endTxt), has: K.q > 0, none: !(K.q > 0),
      res: money(K.worth, K.cc), gain: smoney(K.gain, K.cc) + ' (' + pct(K.gp) + ')', gc: col(K.gain), showGain: K.ago > K.end };

    // action sheet for one holding: add more, reduce, delete
    var ak = s.act && GM[s.act] ? s.act : null, ag = ak ? GM[ak] : { q: 0, now: 0, cost: 0 }, agn = ag.now - ag.cost;
    var actv = { on: !!ak, sym: ak || '', ab: ak ? PKAB(ak) : '', name: ak ? name(ak) : '', qty: ak ? unit(ak, ag.q) : '', v: money(ag.now, dc), pl: smoney(agn, dc) + ' · ' + pct(ag.cost ? agn / ag.cost * 100 : 0), c: col(agn), href: ak ? href(ak) : '',
      close: function () { self.setState({ act: null }); },
      inc: function () { self.setState({ act: null, kp: 'add', as: ak, aago: 0, am: 'q', av: '', cal: false, kc: null }); },
      dec: function () { self.setState({ act: null, kp: 'sub', as: ak, am: 'q', av: '', cal: false, kc: null }); },
      del: function () { setH(H.filter(function (h) { return h.s !== ak; }), F(T.removed, ak)); self.setState({ act: null }); },
      lInc: T.aInc, lDec: T.aDec, lDel: T.aDel, lOpen: T.aOpen };

    // bottom sheet: asset picker
    var sheet = s.sheet || null, pq = (s.pq || '').toLocaleLowerCase('tr'), pcat = s.pcat || 'all';
    var CATS = ['all', 'kripto', 'abd', 'bist', 'emtia', 'doviz', 'fon'].map(function (k) { return [k, T.cats[k]]; });
    var list = BUY.filter(function (k) {
      if (pcat !== 'all' && GRP(k) !== pcat) return false;
      return !pq || k.toLocaleLowerCase('tr').indexOf(pq) >= 0 || name(k).toLocaleLowerCase('tr').indexOf(pq) >= 0;
    }).map(function (k, i, arr) {
      var L = logo(k), A = AS[k];
      return { sym: k, name: name(k), ab: L.ab, price: money(A[2], cur(k)), chg: pct(A[3]), c: col(A[3]), bd: i === arr.length - 1 ? '0' : '1px solid var(--kt18)',
        pick: function () { if (kp) { put(isAdd, { sym: k }); self.setState({ sheet: null, kc: null }); } else self.setState({ sheet: null, kp: 'add', as: k, aago: 0, am: 'q', av: '', cal: false, kc: null }); } };
    });
    var sh = { on: !!sheet, title: kp ? T.pickT : T.addT, close: function () { self.setState({ sheet: null }); },
      typed: function (e) { self.setState({ pq: (e && e.target && e.target.value) || '' }); },
      cats: CATS.map(function (c) { var on = c[0] === pcat; return { l: c[1], bg: on ? 'var(--kF5F7FA)' : 'transparent', fg: on ? 'var(--k000000)' : 'var(--kC4C8D2)', bd: on ? 'var(--kF5F7FA)' : 'var(--kt20)', pick: function () { self.setState({ pcat: c[0] }); } }; }),
      items: list, empty: list.length === 0 };

    return {
      isLine: cm === 'line', isBar: cm === 'bar', isCandle: cm === 'candle', bars: bars, tip: tip, candles: candles,
      tg: { l: cm === 'line' ? TON : 'transparent', b: cm === 'bar' ? TON : 'transparent', c: cm === 'candle' ? TON : 'transparent' },
      setLine: function () { self.setState({ cm: 'line', hx: null }); }, setBar: function () { self.setState({ cm: 'bar', hx: null }); }, setCandle: function () { self.setState({ cm: 'candle', hx: null }); },
      has: H.length > 0, none: H.length === 0, tot: tot, sum: sum, chart: chart, hv: hv, labels: labels, ranges: ranges, curs: curs, alloc: alloc, groups: groups,
      // the list's own ₺/$ switch (same setting as the total card, colours that work on both themes)
      lcurs: ['₺', '$'].map(function (c) { var on = c === dc; return { l: c, on: on ? 'true' : 'false', fg: on ? 'var(--k000000)' : 'var(--kC4C8D2)', bg: on ? 'var(--kF5F7FA)' : 'transparent', pick: function () { self.setState({ dc: c, hx: null }); } }; }),
      ed: ed, edLabel: ed ? T.done : T.edit, toggleEd: function () { self.setState({ ed: !ed }); },
      openAdd: function () { self.setState({ sheet: 'pick', pq: '', pcat: 'all', ed: false }); },
      calc: calc, key: key, cal: cal, sh: sh, actv: actv
    };
  }
}
</script>
