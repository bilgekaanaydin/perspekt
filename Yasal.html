html,body{margin:0;background:#000;color:var(--t1);font-family:Satoshi,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(90% 50% at 85% -10%,rgba(32,93,244,.32) 0%,rgba(32,93,244,.08) 45%,rgba(0,0,0,0) 72%) no-repeat,#000;min-height:100vh}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px;margin-bottom:18px}

.langs a.on{background:#24242A;color:var(--t1)}
h1{margin:6px 0 8px;font-size:34px;line-height:1.03;font-weight:700;letter-spacing:-.02em;background:linear-gradient(180deg,#FFFFFF 35%,#9AB6ED 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{margin:0 0 18px;color:var(--t2);font-size:15px;line-height:1.55}
.draft{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:16px;margin-bottom:18px;background:rgba(245,194,107,.08);box-shadow:inset 0 0 0 .75px rgba(245,194,107,.32);font-size:13.5px;line-height:1.5;color:var(--t1)}
.draft svg{flex-shrink:0;color:var(--warn);margin-top:2px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:22px}
.toc a{height:34px;padding:0 13px;border-radius:17px;display:flex;align-items:center;background:var(--s1);box-shadow:inset 0 0 0 .75px var(--line2);color:var(--t2);font-size:13px;font-weight:500;text-decoration:none}
.toc a:hover{color:var(--t1)}
section{scroll-margin-top:16px;padding:22px 20px;border-radius:22px;background:rgba(21,21,24,.88);box-shadow:inset 0 0 0 .75px var(--line);margin-bottom:12px}
section h2{margin:0 0 12px;font-size:20px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
section h3{margin:16px 0 6px;font-size:15px;font-weight:700;color:var(--t1)}
section p,section li{font-size:14.5px;line-height:1.65;color:var(--t2)}
section p{margin:0 0 10px}
section ul{margin:0 0 10px;padding-left:20px}
section li{margin-bottom:4px}
.ph{color:var(--b3);font-weight:500}
.box{padding:12px 14px;border-radius:14px;background:rgba(79,130,255,.08);box-shadow:inset 0 0 0 .75px rgba(79,130,255,.28);margin:8px 0 12px}
.box p:last-child{margin:0}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:14px;line-height:1.5}
.kv span:nth-child(odd){color:var(--t3)}
.kv span:nth-child(even){color:var(--t1)}
.foot{margin-top:18px;color:var(--t3);font-size:12.5px;line-height:1.5}
@media (max-width:420px){.kv{grid-template-columns:1fr}.kv span:nth-child(even){margin-bottom:8px}h1{font-size:30px}}
